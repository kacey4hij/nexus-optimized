name: Compilar Nexus Optimizer .exe

on:
  push:
    branches: [ "principal" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Descarregar código do repositório
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalar dependências necessárias
      run: |
        python -m pip install --upgrade pip
        pip install customtkinter psutil pyinstaller

    - name: Compilar para .exe independente (PyInstaller)
      run: |
        pyinstaller --noconsole --onefile --name "NexusOptimizer" main.py

    - name: Disponibilizar executável compilado
      uses: actions/upload-artifact@v4
      with:
        name: NexusOptimizer-Executavel
        path: dist/NexusOptimizer.exe
        path: dist/NexusOptimizer.exe
